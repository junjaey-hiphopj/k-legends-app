name: Build AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: npx cap sync android
      - name: Build unsigned release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Publish AAB to builds branch
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/bundle/release/*.aab /tmp/out/app-release-unsigned.aab
          echo "run ${{ github.run_number }} from ${{ github.sha }}" > /tmp/out/BUILD.txt
          cd /tmp/out && git init -q && git checkout -q -b builds
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "AAB build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/log && cp /tmp/build.log /tmp/log/build.log 2>/dev/null || echo "no log" > /tmp/log/build.log
          cd /tmp/log && git init -q && git checkout -q -b buildlog
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "build log ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" buildlog
